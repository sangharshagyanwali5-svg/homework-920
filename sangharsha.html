<DOCTYPE html>
 <html lang="eng">
       <head>
        <title>creation form</title>
         <link rel="stylesheet" href="style.css">
       </head>
 <body>
    <form>
          <h1>form</h1>
    <p>
      <label for="visitor-name">Your Name:</label><br>
      <input type="text" id="visitor-name" name="visitor-name" placeholder="sangharsha " required>
    </p>

    <p>
      <label for="visitor-email">Your email:</label><br>
      <input type="email" id="visitor-email" name="visitor-email" placeholder="sangharsha@gmail.com" required>
    </p>

    <p>
      <label for="visitor-message">feedback:</label><br>
      <textarea id="visitor-message" name="visitor-message" rows="4" cols="45" placeholder="give us your feedback"></textarea>
    </p>
      <button type="submit">Submit Message</button>
    </form>
  </body>
</html>
